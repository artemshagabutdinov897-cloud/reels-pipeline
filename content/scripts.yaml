  - id: 21-ogurcy-sutki
    rubric: Живые заготовки
    title: Огурцы за сутки — и без уксуса
    voiceover: Малосольные за сутки, и ни капли уксуса. Огурчикам кончики срежь — и в банку. Чеснок, укроп зонтиком, лист хрена, смородины. Литр воды, две ложки соли без горки — вскипяти и горячим залей. Сутки на столе — и хрустят так, что соседи слышат. Рецепт — в описании, а сто таких — в книжке.
    scenes:
    - image: Close-up of a crisp lightly salted cucumber being snapped in half above an open glass jar, drops of brine
      motion: The cucumber snaps in half with a crunch, brine drips down
    - image: The grandmother's hands trimming the ends of small green cucumbers on a wooden cutting board
      motion: The knife trims the ends quickly, she drops the cucumbers into a glass jar
    - image: A glass jar packed with cucumbers, dill umbrellas, garlic and horseradish leaves, the grandmother pouring hot brine from an enamel ladle
      motion: The brine fills the jar, dill leaves shift and float up
    - image: The grandmother at the kitchen table holding a lightly salted cucumber
      motion: She bites it with a loud crunch, chews and nods approvingly at the camera
    caption: 'Малосольные огурчики за сутки — и ни капли уксуса. Хрустят так, что соседи через забор слышат 🥒


      Уксус огурцу не нужен. Соль, укроп да время — вот и вся хитрость.


      Что нужно на 3-литровую банку:

      — огурцы мелкие, крепкие — сколько влезет (около 1,5–2 кг)

      — 4–5 зубчиков чеснока

      — 2–3 зонтика укропа

      — лист хрена, 5–6 листьев смородины или вишни

      — на литр воды 2 столовые ложки соли без горки (соль крупная, без йода)


      Как делаю:

      1. Огурцы замочи в холодной воде на пару часов — будут крепче.

      2. Кончики срежь — так рассол быстрее зайдёт.

      3. На дно — половину зелени и чеснок, огурцы стоймя, плотно, сверху остальную зелень.

      4. Рассол вскипяти и горячим залей. Горячий — за сутки, холодный — за двое-трое.

      5. Накрой крышкой неплотно и оставь на столе. Через сутки — в холодильник.


      Совет: хочешь похрустеть уже к ужину — разрежь огурцы вдоль на четвертинки.


      Сохрани, пока огурцы на грядке 😉 А вы с уксусом солите или без? 👇

