# Ролики-цепочки (банка на чёрном фоне и т.п.). Собирает pipeline/chain.py, запускает .github/workflows/chain.yml.
chains:
  - id: "kl01-klyukovka"
    title: Клюковка к Новому году
    resolution: "720p"
    image_style: "Photorealistic studio product photography, vertical 9:16, crisp detail. Matte black surface, pure black background, soft dramatic side light with gentle highlights on the glass. Static front view. No text, no letters, no labels, no logos anywhere."
    video_style: "Static locked-off camera on a tripod, no camera movement, no zoom. Realistic physics and natural speed, premium studio product video on a black background, crisp detail. No text, no subtitles, no labels or logos on any objects, no extra objects appearing."
    keyframes:
      k0:
        prompt: "A wide-mouth 2-litre clear glass jar stands in the center on the black surface, empty and clean, without a lid, with empty space above it in the frame."
      k1:
        refs: [k0]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. Now the bottom third of the jar is filled with fresh glossy red cranberries. No hands, no other objects."
      k2:
        refs: [k1]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The cranberries inside the jar are now crushed into a coarse bright red mash with red juice, some whole berries remain. No hands, no tools."
      k3:
        refs: [k2]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. A neat mound of white sugar now lies on top of the crushed red cranberries inside the jar. No hands, no other objects."
      k4:
        refs: [k3]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now filled two thirds with clear vodka over the crushed cranberries and sugar, the liquid is slightly pink, a few berries float. No hands, no bottle."
      k5:
        refs: [k4]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now closed with a simple plain silver metal screw lid, and the liquid inside is a deep translucent ruby red with cranberries suspended in it, glowing in the side light. No hands."
      k6:
        refs: [k5]
        prompt: "Same black studio background and lighting as in the reference image. A woman's hand with a dark red manicure tilts the same glass jar of deep ruby cranberry liqueur, pouring it through a fine round metal sieve into an elegant clear glass carafe standing on the black surface; crushed cranberries stay in the sieve."
      k7:
        refs: [k6]
        prompt: "Same black studio background and lighting as in the reference image. The same clear glass carafe of ruby cranberry liqueur is tilted above an empty small crystal shot glass standing on the black surface, a few fresh cranberries scattered around, a woman's hand with a dark red manicure holds the carafe."
    clips:
      - type: frames
        first: k0
        last: k1
        seconds: 4
        prompt: "A woman's hand with a dark red manicure enters from the top holding a glass bowl and pours fresh red cranberries into the jar, the berries tumble and bounce down, then the hand moves away out of frame."
      - type: frames
        first: k1
        last: k2
        seconds: 4
        prompt: "A wooden pestle comes down into the jar from above and crushes the cranberries with a few firm presses, red juice appears, then the pestle is lifted up out of frame."
      - type: frames
        first: k2
        last: k3
        seconds: 4
        prompt: "A small glass bowl appears above the jar and white sugar pours down in a thin stream, forming a mound on the crushed berries, then the bowl moves away out of frame."
      - type: frames
        first: k3
        last: k4
        seconds: 4
        prompt: "A plain clear glass bottle without any label tilts in from the top and pours clear vodka into the jar, the liquid level rises over the berries and sugar, then the bottle moves away out of frame."
      - type: frames
        first: k4
        last: k5
        seconds: 5
        prompt: "A hand screws a plain metal lid onto the jar, lifts the jar and shakes it a few times so the liquid swirls and turns deep ruby red, then sets it back down in the same place and moves away."
      - type: image
        image: k6
        seconds: 4
        prompt: "The ruby liqueur flows from the jar through the fine sieve into the carafe in a steady glossy stream, the crushed cranberries collect in the sieve."
      - type: image
        image: k7
        seconds: 4
        prompt: "The ruby liqueur pours from the carafe into the shot glass and fills it to the brim, then the carafe lifts away and the full glass glows in the light."
