  - id: s02-pirog-na-tancah
    rubric: Сериал
    title: "Тетрадь деда Коли. Часть 2: Он украл мой пирог на танцах"
    voiceover: >-
      Семьдесят второй год, клуб, танцы. Я принесла пирог с антоновкой, на всех. Отвернулась — половины нет.
      Стоит парень, щёки набиты, и говорит: «Выйдешь за меня — буду каждый день такой есть».
      Сорок лет я рассказывала, что это он ко мне пристал. А в тетради Коля пишет: «Пирог я не крал. Мне его Зоина подружка отдала — чтоб я наконец подошёл».
