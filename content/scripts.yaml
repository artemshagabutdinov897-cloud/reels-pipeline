    title: Мочёные яблоки
    hook: "Яблоки, которые хранятся до весны без сахара"
    voiceover: >-
      Мочёные яблоки — это вам не варенье, тут сахара чуть.
      Антоновку плотно в банку, листья смородины переложи. Рассол: литр воды, ложка соли, ложка мёда, стакан ржаной муки заварить и процедить.
