  - id: s06-pryanik
    rubric: Сериал
    title: "Тетрадь деда Коли. Часть 6: Рецепт, который Коля не успел мне отдать"
    voiceover: >-
      Пустая страница. А сверху: «Медовый пряник. Для Зои».
      Сорок два года я просила у него этот рецепт. А он смеялся: потом, Зоя, потом.
      Серёжа вспомнил: дед всё продиктовал, а тот не успел дописать. И рассказал мне по памяти.
      Испекла. Первый раз. Пахнет как тогда, на пасеке. Всё, что было в Колиной тетради, и всё, что знаю я, — теперь в моей книжке. Напиши в комментариях «книга» — пришлю.
    scenes:
