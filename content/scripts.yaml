      Съездила я по тому адресу из прошлой серии. Там, оказывается, жил старый пасечник Фёдор Ильич. У него Коля в 74-м взял первый улей. Мне сказал — «на базаре купил».

      Коля с пчёлами разговаривал. Сядет вечером у улья и шепчет. Я смеялась: «Коль, они ж не понимают». А он в тетради пишет:
      «Пчела на ночь не ест и зря не суетится. Весь день работает, а вечером — тишина. Зоя, поучись».

      Поучилась. С тех пор вечером ем только лёгкое, а на ночь — его мятный чай:
      1. Горсть свежей мяты или ложка сушёной.
      2. Залей горячей водой (не кипятком), накрой, 7–10 минут.
      3. Процеди, дай остыть до тёплого.
      4. Ложка мёда — вприкуску или в тёплый чай.
      Выпил — и спать, без телевизора.

      Листаю дальше. А там строчка: «Продал два улья. Зое не говорить».
      Продал? Коля? Который над каждой пчелой трясся?

      Как думаете, зачем? 👇 Завтра узнаете.

