      Последние страницы в тетради — почерк внука, Серёжи. Ему тогда было тринадцать. У Коли уже руки не слушались, и он диктовал, а Серёжа записывал.

      Я ему позвонила. Он долго молчал. Потом говорит:
      «Бабуль, дед велел отдать тетрадь, когда ты скучать начнёшь. А я боялся — вдруг ты плакать будешь. Вот и спрятал на чердак, в его коробку».

      Шесть лет мальчишка носил в себе дедов секрет. Ни разу не проговорился. Весь в деда.

      В субботу он приехал. Молча обнял. И сварил мне Колину кашу — дед его научил, пока тот записывал:
      1. Стакан гречки промой и обсуши на сухой сковороде 2–3 минуты, до орехового запаха.
      2. Два стакана кипятка, щепоть соли.
      3. Закипело — огонь на самый малый, крышку не открывать 15 минут.
      4. Сними, заверни в полотенце ещё на 10 минут.
      5. Кусочек масла и кружка холодного молока рядом.

      А одну страницу Коля оставил пустой. Только заголовок сверху.

