      6 бабушкиных секретов — сохрани, пригодятся 👇

      1. Новые туфли натирают — намажь пятку дезодорантом перед тем, как обуться.
      2. Ноги пахнут — 15 минут в тёплой воде с ложкой соды.
      3. Подмышки потеют — на ночь яблочный уксус пополам с водой. Не после бритья и не на раздражённую кожу.
      4. Ноготь врос — распарь ногу в горячей солёной воде и подложи под край кусочек ватки. Покраснело сильно, гноится, болит — сразу к врачу.
      5. Губы потрескались — мёд с щепоткой сахара, потри минутку и смой.
      6. Волосы быстро жирнятся — после мытья ополосни водой с ложкой уксуса на литр.

      Мёд — не при аллергии.

