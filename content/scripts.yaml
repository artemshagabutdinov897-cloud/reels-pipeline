# Сценарии роликов бабы Зои.
#
# Каждый ролик 20–30 секунд. Структура: крючок (первые 2 секунды) → рецепт → призыв.
# Поля:
#   hook       — крупная надпись в первые секунды ролика (на экране, не озвучивается)
#   voiceover  — текст озвучки (ElevenLabs). Из него же строятся субтитры.
#   scenes     — кадры по порядку. image: что должно быть в стартовом кадре
#                (правка эталонного фото бабушки), motion: что происходит в кадре.
#   caption    — подпись к посту в Instagram.
#
# Промпты сцен — на английском: видеомодели понимают его лучше.

