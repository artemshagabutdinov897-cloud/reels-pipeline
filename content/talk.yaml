  - id: "38-limon-utro"
    title: Тёплая вода с лимоном и мёдом натощак — формат «модель кишечника» (гипотеза Артёма, 2026-10-08)
    cfg:
      subtitles: "karaoke"
      words_per_line: 1
      highlight_color: "FFFFFF"
      font_size: 104
    talk_in:
      text: >-
        Вот он, кишечник, милок. Всё, что ты съел, идёт тут — метр за метром. Батон, колбаса, сладкий йогурт. А утром он у тебя спит, как и ты.
      image: "Medium shot outdoors: the grandmother sitting on the wooden porch of an old log house, green garden and trees behind her, soft overcast daylight, looking straight into the camera. In front of her chest she holds with both hands a clear transparent plastic educational anatomical model of the human intestines: hollow see-through tubes of the small intestine coiled inside the frame of the large intestine, partly filled with beige-brown food mush, about the size of a serving tray. In her other hand a small glass of white drinking yogurt tilted over the top opening of the model, a thin stream of white yogurt pouring into it"
      motion: "The grandmother talks to the camera, pours a little white yogurt into the top of the transparent intestine model, then lifts the model slightly to show it, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        Воду грею, но не кипячу — тёплая, как парное молоко. Пару кружков свежего лимона. Снимаю с огня — и ложку мёда: в кипяток мёд не кладут. И в кружку.
      scenes:
        - image: "Close-up outdoors: a small white enamel saucepan with a dark blue rim and a black handle, filled with water, on a compact portable camping gas stove with a blue flame, standing on a weathered wooden table in the yard of an old log house, green garden blurred behind, the grandmother's hands in burgundy knitted cardigan sleeves holding the pot handle"
          motion: "The water warms gently, tiny wisps of steam rise, the blue flame flickers"
        - image: "Close-up outdoors: the grandmother's hands dropping thin slices of fresh lemon into the warm water in a small white enamel saucepan with a dark blue rim and a black handle on a portable camping gas stove on a weathered wooden table, a halved lemon and a glass jar of golden honey beside, log house wall behind"
          motion: "The lemon slices slide into the water one by one and float, the water ripples"
        - image: "Close-up outdoors: the grandmother's hand stirring a spoonful of thick golden honey into the warm lemon water in a small white enamel saucepan with a dark blue rim and a black handle standing on the wooden table next to the turned-off portable gas stove, a glass jar of honey with a spoon beside"
          motion: "The spoon stirs slowly, the honey dissolves in golden swirls around the lemon slices"
        - image: "Close-up outdoors: warm golden lemon water with a lemon slice being poured from a small white enamel saucepan with a dark blue rim and a black handle into a clear glass mug on a weathered wooden table, soft daylight, green garden behind"
          motion: "The warm drink pours into the glass mug, the lemon slice tumbles in, light steam rises"
    talk_out:
      text: >-
        Стакан натощак, за полчаса до завтрака. Десять дней — и почуешь: живот по утрам просыпается вовремя. Это не лекарство, просто тёплое будит кишечник. Пиши «Книга» — забирай мои рецепты для живота.
      image: "Medium close-up outdoors: the grandmother sitting at a weathered wooden table in the yard of an old log house, green garden and trees behind her, soft overcast daylight, holding with both hands a clear glass mug of warm golden lemon water with a lemon slice inside, looking straight into the camera with a calm kind smile"
      motion: "The grandmother speaks to the camera calmly, holds the glass mug, takes a small sip and nods, small natural head movements, handheld smartphone video"
    caption: |
      Тёплая вода с лимоном и мёдом натощак 🍋

      Шлаков в кишечнике нет — он чистится сам. Но утром он просыпается не сразу, и стакан тёплого его будит.

      Что нужно на стакан:
      — 250 мл воды
      — 2 кружка свежего лимона
      — 1 ч. л. мёда

      Как делаю:
      1. Воду грею до тёплой, как парное молоко, — не кипячу.
      2. Кладу лимон, снимаю с огня.
      3. Мёд — только в тёплую: в кипятке он теряет вкус.
      4. Пью натощак, за полчаса до завтрака.

      Мёд нельзя детям до года и при аллергии. При язве и гастрите с лимоном осторожно. Запор дольше недели, боль или кровь — сразу к врачу.

