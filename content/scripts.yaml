  - id: 24-kasha-gorshok
    rubric: Каши и взвары
    title: Каша из печки — внуки не верили
    voiceover: Кашу из печки в горшке пробовали? Вот и внуки не пробовали, пока ко мне не приехали. Пшено семь раз промой и кипятком ошпарь — горчить не будет. Тыкву кубиком на дно, пшено сверху, молоко, щепоть соли. В печь на час — само томится. Корочка румяная, внутри как крем. Можно и в духовке. Рецепт — в описании.
    scenes:
    - image: Close-up of an opened clay pot with golden millet porridge with pumpkin and a browned crust, a wooden spoon breaking the crust
      motion: The spoon breaks the crust and scoops up creamy orange porridge
    - image: The grandmother washing millet in an enamel bowl, pouring water from a jug
      motion: She swirls the grain with her hand and pours off the cloudy water
    - image: The grandmother putting a clay pot into a white Russian stove with a long iron oven fork
      motion: She pushes the pot deep into the oven and closes the oven door
    - image: The grandmother and her little granddaughter at a wooden table eating porridge from clay bowls
      motion: The girl eats a spoonful, the grandmother strokes her head and smiles
    caption: 'Внучка первый раз попробовала кашу из печки и говорит: бабуль, это что, десерт? 😄 Нет, милая, это пшёнка. Просто правильная.


      Секрет не в печке, а в двух вещах: промыть и не торопить. А духовка тоже справится.


      Что нужно на 2–3 порции:

      — 1 стакан пшена

      — 300 г тыквы

      — 3 стакана молока (можно пополам с водой)

      — щепоть соли, ложка мёда или сахара по вкусу

      — кусочек сливочного масла


      Как делаю:

      1. Пшено промой раз семь, пока вода не станет прозрачной.

      2. Залей кипятком на минуту и слей — горечь уйдёт.

      3. Тыкву кубиком — на дно горшка, сверху пшено, соль.

      4. Залей горячим молоком, чтобы было на два пальца выше крупы.

      5. В печь или в духовку на 160 градусов на час, крышку не открывай.

      6. Под конец — кусочек масла, и ещё 10 минут без крышки, чтобы корочка зарумянилась.


      Горшка нет — подойдёт любая кастрюлька с толстым дном, которая идёт в духовку.


      Сохрани на завтрак в выходной 😉 А вы пшёнку любите или с детства невзлюбили? 👇

