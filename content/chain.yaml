  - id: "l03-braga"
    title: Урок 3 · Брага сахарная и зерновая
    resolution: "720p"
    image_style: "Photorealistic studio product photography, vertical 9:16, crisp detail. Matte black surface, pure black background, soft dramatic side light with gentle highlights on the glass and metal. Static front view. No text, no letters, no numbers, no labels, no logos anywhere."
    video_style: "Static locked-off camera on a tripod, no camera movement, no zoom. Realistic physics and natural speed, premium studio product video on a black background, crisp detail. No text, no subtitles, no labels or logos on any objects, no extra objects appearing, nothing floating in the air."
    keyframes:
      k0:
        prompt: "A large clean clear glass fermentation jar (about 10 litres) with a wide neck stands in the center on the black surface, empty, with empty space above it in the frame."
      k1:
        refs: [k0]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now filled two thirds with warm cloudy sugar syrup, a soft swirl of dissolving sugar inside. No hands, no other objects."
      k2:
        refs: [k1]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. A layer of creamy light-beige yeast foam now floats on top of the cloudy liquid. No hands, no other objects."
      k3:
        refs: [k2]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now closed with a white silicone stopper with a small clear water airlock on top, half filled with water; inside, the pale yellow liquid is cloudy with fine rising bubbles and light foam. No hands."
      k4:
        refs: [k3]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The same closed jar with the airlock, but now the liquid is clear pale straw-coloured with a thin pale sediment layer on the bottom and no foam. No hands."
      k5:
        prompt: "A large brushed stainless steel pot on a black induction cooktop on the black surface, filled with thick creamy white wheat porridge mash, gentle steam rising, a long wooden paddle resting across the rim."
    clips:
      # подпись: сахар 5 кг + вода 20 л, 28–30°
      - type: frames
        first: k0
        last: k1
        seconds: 5
        prompt: "a woman's hand with a dark red manicure tilts a large plain glass jug in from the top and pours warm sugar syrup into the jar, the liquid swirls and rises to two thirds, then the jug and the hand move away out of frame."
      # подпись: дрожжи — по инструкции
      - type: frames
        first: k1
        last: k2
        seconds: 4
        prompt: "a woman's hand with a dark red manicure holds a small glass of foamy activated yeast above the jar and pours it in, the foam spreads over the surface, then the hand moves away out of frame."
      # подпись: гидрозатвор, тепло 24–28°
      - type: frames
        first: k2
        last: k3
        seconds: 4
        prompt: "a woman's hand with a dark red manicure presses a white silicone stopper with a small water airlock firmly into the neck of the jar and moves away; fine bubbles start rising inside."
      # подпись: 7–10 дней — пока гидрозатвор не затихнет
      - type: frames
        first: k3
        last: k4
        seconds: 4
        prompt: "Time-lapse of several days: the bubbling slowly fades, the cloudy liquid gradually clears to pale straw colour and a thin sediment settles on the bottom. Nothing else changes."
      # подпись: зерновая: 62–65°, полтора часа с солодом
      - type: image
        image: k5
        seconds: 5
        prompt: "a woman's hand with a dark red manicure slowly stirs the thick steaming wheat mash with the wooden paddle, gentle steam curls up from the pot."
  - id: "l04-peregonka"
    title: Урок 4 · Перегонка и отбор «голов»
    resolution: "720p"
    image_style: "Photorealistic studio product photography, vertical 9:16, crisp detail. Matte black surface, pure black background, soft dramatic side light with gentle highlights on the glass and metal. Static front view. No text, no letters, no numbers, no labels, no logos anywhere."
    video_style: "Static locked-off camera on a tripod, no camera movement, no zoom. Realistic physics and natural speed, premium studio product video on a black background, crisp detail. No text, no subtitles, no labels or logos on any objects, no extra objects appearing, nothing floating in the air."
    keyframes:
      k0:
        prompt: "A compact home pot still: a brushed stainless steel boiler (about 20 litres) on a black induction cooktop, a short copper column on top and a straight copper condenser tube going down to the right with a small spout at its end; under the spout stands a small clear glass (100 ml), empty. Thin clear water hoses connected to the condenser. Clean metal, no labels, no logos, no numbers."
      k1:
        refs: [k0]
        prompt: "Keep exactly the same still, camera angle, black background and lighting as in the reference image. A few clear drops are falling from the spout into the small glass, which now holds a little clear liquid. No hands."
      k2:
        refs: [k1]
        prompt: "Keep exactly the same still, camera angle, black background and lighting as in the reference image. The small glass with the first drops now stands aside on the black surface to the right of the still, closed with a red lid; under the spout stands a clean 0.5 litre clear glass jar, and a thin steady stream of clear distillate flows into it. No hands."
      k3:
        prompt: "A row of five identical clean 0.5 litre clear glass jars on the black surface, the first three filled with crystal clear spirit, the last two empty, soft side light glinting on the glass. No labels, no numbers."
    clips:
      # подпись: воду в холодильник — раньше, чем пойдёт пар
      - type: image
        image: k0
        seconds: 4
        prompt: "The still heats quietly: a faint shimmer of hot air above the boiler, the clear water hoses tremble slightly as cold water flows. Nothing drips yet."
      # подпись: «головы» — первые капли, 1–2 в секунду. В них метанол — сливаем, не пробуем
      - type: frames
        first: k0
        last: k1
