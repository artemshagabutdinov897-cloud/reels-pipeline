name: clip
on:
  workflow_dispatch:
    inputs:
      name: {required: true}
      seconds: {required: true}
      ref: {required: true}
      image: {required: true}
      motion: {required: true}
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r pipeline/requirements.txt
      - name: generate
        env:
          BRATUHA_API_KEY: ${{ secrets.BRATUHA_API_KEY || secrets.YK_SECRET }}
          IMG: ${{ inputs.image }}
          MOT: ${{ inputs.motion }}
        run: python -u pipeline/clip_one.py "${{ inputs.name }}" "${{ inputs.seconds }}" "${{ inputs.ref }}" "$IMG" "$MOT"
      - name: save
        run: |
          git config user.name "artemshagabutdinov897-cloud"
          git config user.email "artemshagabutdinov897@gmail.com"
          git add previews
          git commit -m "clip ${{ inputs.name }}" || true
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 8; done
