  - id: s01-tetrad
    rubric: Сериал
    title: "Тетрадь деда Коли. Часть 1: Нашла то, что Коля прятал 40 лет"
    voiceover: >-
      Полезла на чердак за банками, а там коробка из-под чая, жестяная. Колина. Я её сорок лет не видела.
      А в ней тетрадь. Открываю — его почерк. Первая строчка: «Зоя, если ты это читаешь — значит, я не успел сказать сам».
      Села прямо на пол. Чай заварила, как он любил, с чабрецом, и читала до ночи.
      А на последней странице — не его почерк.
    scenes:
      - image: The grandmother climbing a wooden ladder into a dusty village attic, light from a small window, old jars and baskets around
        motion: She climbs up slowly, looks around the attic and stops, noticing something in the corner
