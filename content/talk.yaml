# Ролики «баба Зоя говорит в камеру»: talk_in (в камеру, липсинк) → broll (готовка под закадр) → talk_out (в камеру).
# Собирает pipeline/talk.py.

talks:
  - id: "00-hello"
    title: Кружочек-приветствие для бота
    talk_in:
      text: >-
        Здравствуй, милок! Я баба Зоя. Рада, что заглянул. Держи от меня семь рецептов в подарок — жми кнопку внизу.
      image: "Close-up selfie-style shot: the grandmother in her rustic kitchen with the white Russian stove behind her, face in the upper middle of the frame, looking straight into the camera with a warm kind smile, one hand raised in a friendly wave"
      motion: "The grandmother greets the viewer warmly, waves her hand, smiles and nods, small natural head movements, handheld smartphone selfie video"

  - id: "26-hleb-mesyac"
    title: Батон, который не черствеет
    talk_in:
      text: >-
        Этот батон я купила месяц назад. Месяц, милок! Ни плесени, ни корочки — мягкий, как вчерашний. А что ж тогда в нём такое?
      image: "Medium close-up: the grandmother standing in her rustic kitchen, looking straight into the camera, holding up in one hand a soft white supermarket loaf in a plain clear plastic bag without any print, squeezing it slightly with her fingers"
      motion: "The grandmother talks to the camera with a puzzled, slightly suspicious expression, raises her eyebrows, squeezes the loaf, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        А мой хлеб — мука ржаная, вода, соль да закваска. С вечера замесила, к утру поднялся. Час в печке — и корочка трещит. А через неделю он зачерствеет, как и положено живому хлебу.
      scenes:
        - image: "Close-up of the grandmother's hands mixing dark rye dough in a large wooden bowl on a floured table"
          motion: "Her hands knead and fold the sticky rye dough"
        - image: "A round rye dough rising in a clay bowl covered with a linen towel on a sunny windowsill, morning light"
          motion: "She lifts the corner of the towel and looks at the risen dough, pleased"
        - image: "The grandmother taking a dark crusty rye loaf out of the whitewashed Russian stove with a wooden peel"
          motion: "She pulls the loaf out of the stove and puts it on the table"
        - image: "Close-up: the grandmother cutting the dark rye loaf with a large knife on a wooden board, crumbs on the table"
          motion: "The knife goes through the crackling crust, a thick slice falls over"
    talk_out:
      text: >-
        Живой хлеб долго не живёт, милок, зато и живот после него спокойный. Закваска и хлеб с граммами — в моей книжке. Напиши в комментариях «книга» — пришлю.
      image: "Medium close-up: the grandmother sitting at the kitchen table with a checkered oilcloth, holding a thick slice of dark rye bread, a whole rye loaf on the board in front of her, looking warmly straight into the camera"
      motion: "The grandmother talks to the camera warmly with a gentle sly smile, nods, small natural gestures with the bread slice, handheld smartphone video"
    caption: |
      Этот батон месяц пролежал — и хоть бы что. А мой ржаной через неделю черствеет. Живой хлеб долго не живёт 🍞

      Мой хлеб — это ржаная мука, вода, соль и закваска. Замешиваю с вечера, к утру поднялся, час в печке (в духовке тоже получится).

      Закваску заводят за неделю: каждый день по ложке ржаной муки и тёплой воды в банку. Подробно, с граммами — в книжке.

      🎁 Напиши любой комментарий — пришлю рецепт в личку и ещё семь в подарок

      А ты какой хлеб берёшь? 👇

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

      #хлебназакваске #ржанойхлеб #закваска #домашнийхлеб #бабушкинырецепты #деревенскаяеда #рецептыбабушки #бабазоя

  - id: "27-kisel-paket"
    title: Кисель из пакета и настоящий
    talk_in:
      text: >-
        Вот это — кисель из пакетика. Сахар, крахмал да краска. А настоящий кисель у нас в деревне варили вот из чего.
      image: "Medium close-up: the grandmother in her rustic kitchen looking straight into the camera, holding up in one hand a small plain paper sachet of instant pink jelly powder without any print, and in the other hand a glass jar of rolled oats"
      motion: "The grandmother talks to the camera, shakes the sachet with a disapproving look, then lifts the jar of oats and smiles, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        Вечером стакан овсяных хлопьев заливаю тёплой водой, сверху корочку ржаного — и под полотенце. Утром процеживаю через марлю, отжимаю. Варю на тихом огне и мешаю, пока не загустеет, как сметана. Щепотка соли, кусочек масла.
      scenes:
        - image: "Close-up: the grandmother pouring warm water from an enamel kettle over rolled oats in a glass jar, a crust of rye bread next to it"
          motion: "Water pours over the oats, she puts the bread crust on top"
        - image: "Morning, the grandmother straining the cloudy oat liquid through gauze into an enamel pot, squeezing the gauze with her hands"
          motion: "She squeezes the gauze bundle, the milky liquid runs into the pot"
        - image: "The grandmother stirring a thick creamy oat kissel in a small enamel pot on the stove with a wooden spoon"
          motion: "She stirs slowly, the kissel thickens and coats the spoon"
        - image: "Close-up: warm thick oat kissel poured from the pot into a glass mug, a small piece of butter melting on top"
          motion: "The kissel flows into the mug, the butter melts"
    talk_out:
      text: >-
        Стаканчик тёплого киселя с утра — и до обеда сыт, и в животе тепло. Напиши в комментариях «книга» — пришлю тебе в личку ещё рецепты.
      image: "Medium close-up: the grandmother sitting by the window with geraniums, holding a glass mug of warm creamy oat kissel with both hands, looking warmly straight into the camera"
      motion: "The grandmother talks to the camera warmly, smiles, raises the mug slightly, small natural head movements, handheld smartphone video"
    caption: |
      Кисель из пакетика — это сахар, крахмал да краска. А настоящий овсяный варили в каждой деревне из того, что было в доме 🥣

      Что нужно:
      — стакан овсяных хлопьев (не быстрых)
      — 3 стакана тёплой кипячёной воды
      — корочка ржаного хлеба
      — щепотка соли, кусочек масла

      1. Вечером залей хлопья тёплой водой, сверху корочку, накрой полотенцем.
      2. Утром процеди через марлю и хорошо отожми.
      3. Вари на тихом огне, всё время мешая, 5–7 минут — пока не загустеет, как сметана.
      4. Посоли, положи масло. Пей тёплым.

      🎁 Напиши любой комментарий — пришлю рецепт в личку и ещё семь в подарок

      Сохрани на утро. Ты пробовал настоящий кисель? 👇

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

      #кисель #овсяныйкисель #завтрак #бабушкинырецепты #деревенскаяеда #рецептыбабушки #простыерецепты #бабазоя

  - id: "28-smetana"
    title: Сметана, которая не киснет
    talk_in:
      text: >-
        Эту сметану я купила три недели назад. Три недели, милок! А она как новенькая. Настоящая столько не живёт.
      image: "Medium close-up: the grandmother standing in her rustic kitchen, looking straight into the camera, holding up in one hand a small plain white plastic cup of sour cream without any print or label, the lid half open"
      motion: "The grandmother talks to the camera with a suspicious squint, tilts the cup, sniffs it and shakes her head, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        Вечером наливаю банку деревенского молока — и в холодок. К утру сверху сливки, вот такой слой. Снимаю ложкой, кладу ложку вчерашней сметаны и ставлю в тепло на сутки. Назавтра ложка в ней стоит.
      scenes:
        - image: "Close-up: the grandmother pouring fresh whole milk from an enamel jug into a large glass jar on a wooden table, evening light"
          motion: "The milk pours into the jar and fills it to the top"
        - image: "Close-up of a glass jar of milk with a thick yellowish layer of cream on top, the grandmother's hand skimming the cream with a wooden spoon into a small bowl"
          motion: "She slowly skims the thick cream off the top"
        - image: "A small clay pot of cream wrapped in a linen towel standing on the warm ledge of a whitewashed Russian stove"
          motion: "The grandmother tucks the towel around the pot and pats it gently"
        - image: "Close-up: a wooden spoon standing upright on its own in a clay pot of very thick homemade sour cream"
          motion: "The grandmother lets go of the spoon, it stays standing upright, she taps it with a finger"
    talk_out:
      text: >-
        Живая сметана через неделю скиснет — и правильно. Зато в борще, на блинах — совсем другой вкус. Напиши в комментариях «книга» — пришлю рецепты.
      image: "Medium close-up: the grandmother sitting at the kitchen table with a checkered oilcloth, a clay pot of thick homemade sour cream and a plate of pancakes in front of her, looking warmly straight into the camera"
      motion: "The grandmother talks to the camera warmly with a sly smile, dips a pancake into the sour cream, nods, handheld smartphone video"
    caption: |
      Три недели стоит — и хоть бы что. А живая сметана так не умеет 🥛

      Как делаю я — сливки с банки молока, ложка вчерашней сметаны, сутки в тепле. С граммами — в книжке.

      А ты какую берёшь? 👇

      Подпишись и будь здоров.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

  - id: "29-suhariki"
    title: Сухарики из пачки и мои
    talk_in:
      text: >-
        Внук привёз сухарики. Я на пачку глянула — там слов больше, чем в моей книжке. Ну-ка, Серёжа, отдай бабушке.
      image: "Medium close-up: the grandmother standing in her rustic kitchen, looking straight into the camera, holding up a small plain silver foil snack bag without any print or logo between two fingers, a skeptical look"
      motion: "The grandmother talks to the camera, squints at the foil bag, shakes it with a disapproving look, then puts it away behind her back with a sly smile, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        Беру вчерашний ржаной, режу брусочками. Чеснок давлю с солью и ложкой масла, всё перемешиваю. На противень — и в печку, минут на пятнадцать. Хрустят так, что на всю избу слышно.
      scenes:
        - image: "Close-up: the grandmother's hands cutting a dark rye loaf into small cubes with a big knife on a wooden board"
          motion: "The knife cuts the bread into neat little cubes, crumbs fall"
        - image: "Close-up: rye bread cubes in a wide enamel bowl, the grandmother's hands tossing them with crushed garlic and oil"
          motion: "Her hands toss the bread cubes, coating them in garlic oil"
        - image: "The grandmother sliding a black baking tray of bread cubes into the hot oven of a whitewashed Russian stove"
          motion: "She pushes the tray in and closes the stove door"
        - image: "Close-up: golden crunchy rye croutons poured from a baking tray into a clay bowl, a young man's hand reaching in to grab some"
          motion: "Croutons tumble into the bowl, a hand grabs a few"
    talk_out:
      text: >-
        Серёжа полтарелки за раз умял, а про свои и не вспомнил. Напиши в комментариях «книга» — пришлю тебе рецепты.
      image: "Medium close-up: the grandmother sitting at the kitchen table with a clay bowl of golden rye croutons, looking warmly straight into the camera"
      motion: "The grandmother talks to the camera with a proud sly smile, takes a crouton and crunches it, nods, handheld smartphone video"
    caption: |
      Внук привёз сухарики из пачки. Пришлось показать, какие бывают настоящие 😄

      Вчерашний ржаной, чеснок, соль, ложка масла — 15 минут в духовке на 180.

      А ты что внукам готовишь вместо магазинного? 👇

      Подпишись и будь здоров.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

  # ---------- Сериал «Тетрадь деда Коли», сезон 1 (формат: в камеру → флешбэки под закадр → крючок в камеру)

  - id: "s1e1-tetrad"
    title: "Тетрадь деда Коли. Часть 1"
    talk_in:
      text: >-
        Полезла я на чердак за банками. А там — вот эта коробка. Колина. Я её сорок лет не видела.
      image: "Medium close-up: the grandmother sitting at the kitchen table, holding up towards the camera an old rusty tin tea box with a faded floral pattern, dust on the lid, looking straight into the camera, a bit shaken"
      motion: "The grandmother talks to the camera quietly, turns the tin box in her hands, wipes the dust with her palm, handheld smartphone video"
    broll:
      text: >-
        А в коробке тетрадь. Его почерк. Первая строчка: «Зоя, если ты это читаешь — значит, я так и не решился сказать сам». Заварила чай с чабрецом, как он любил, и читала до ночи. Про пчёл, про пироги, про меня.
      scenes:
        - image: "The grandmother climbing a wooden ladder into a dusty village attic, light from a small window, old jars and baskets around"
          motion: "She climbs up slowly, looks around the attic and stops, noticing something in the corner"
        - image: "Close-up of the grandmother's hands opening an old rusty tin tea box, inside lies a worn school notebook"
          motion: "Her hands slowly lift the lid and take out the notebook"
        - image: "Close-up of an old yellowed notebook page covered in faded illegible handwriting and a small pencil drawing of a bee, the grandmother's finger touching the first line"
          motion: "Her finger slowly moves along the first line, trembling slightly"
        - image: "The grandmother at the kitchen table at night under a warm lamp, a glass of tea with thyme sprigs, the old notebook open in front of her"
          motion: "She sips the tea and turns a page, absorbed in reading"
    talk_out:
      text: >-
        А последняя страница написана не им. Почерк женский. И подпись — одна буква, «эн». И «прости меня, Зоя». Сорок два года вместе прожили… Кто она такая?
      image: "Close-up: the grandmother at the kitchen table at night under a warm lamp, holding the old open notebook with both hands, looking straight into the camera with a serious, worried face"
      motion: "The grandmother speaks quietly and seriously to the camera, glances down at the page, then looks back up into the camera and slowly closes the notebook, handheld smartphone video"
    caption: |
      Тетрадь деда Коли. Часть 1 📓

      Сорок два года вместе. Думала, знаю про него всё. А на последней странице — чужой почерк.

      Как думаете, кто такая «Н.»? Пишите 👇 Завтра — часть 2.

      Подпишись, чтоб не пропустить.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей.

  - id: "s1e2-pirog"
    title: "Тетрадь деда Коли. Часть 2"
    talk_in:
      text: >-
        Всю ночь не спала. Кто такая «эн»? Стала читать сначала. А там — про тот самый пирог.
      image: "Medium close-up: the grandmother in her kitchen in the early morning, tired eyes, holding the old worn notebook open in one hand, looking straight into the camera"
      motion: "The grandmother talks to the camera, shakes her head, taps the notebook page with a finger, handheld smartphone video"
    broll:
      text: >-
        Семьдесят второй год, танцы в клубе. Я принесла пирог с антоновкой. Отвернулась — половины нет. Стоит парень, щёки набиты: «Выйдешь за меня — буду каждый день такой есть». Я сорок лет рассказывала, что он ко мне пристал. А Коля пишет: «Пирог мне Галька отдала. Сам бы год не решился».
      scenes:
        - flashback: true
          image: "A 1970s Soviet village club dance hall in the evening, young people dancing, a table with a round apple pie on a plate, young Zoya in a red polka-dot headscarf standing by the table"
          motion: "Couples dance in the background, young Zoya turns away from the table to talk to a friend"
        - flashback: true
          image: "Young Kolya with his mouth full, holding a big piece of apple pie, grinning shyly at young Zoya in the village club"
          motion: "He chews, grins and says something, she puts her hands on her hips and laughs"
        - image: "The grandmother in her kitchen taking a golden apple pie out of the oven, the old notebook lying open on the table"
          motion: "She sets the pie on the table and smiles, shaking her head at a memory"
        - image: "Close-up of the grandmother's fingers pulling a small old black-and-white photograph with white borders from between yellowed notebook pages"
          motion: "She slowly pulls out the photo and her fingers stop"
    talk_out:
      text: >-
        А между страницами — карточка. Коля молодой, у улья. А рядом девушка. Не я. На обороте: «Коле от Нины. Семьдесят четвёртый». Мы тогда уже два года женаты были.
      image: "Close-up: the grandmother at the kitchen table holding a small old black-and-white photograph with white borders, its back turned towards the camera and completely blank, looking straight into the camera with a hurt, stunned face"
      motion: "The grandmother speaks slowly to the camera, looks at the photo, then back into the camera, presses her lips together, handheld smartphone video"
    caption: |
      Тетрадь деда Коли. Часть 2 🥧

      Пирог на танцах, оказывается, был подстроен. Но это не самое главное, что я нашла.

      Кто такая Нина? Пишите версии 👇 Завтра — часть 3.

      Подпишись, чтоб не пропустить.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей.

  - id: "s1e3-adres"
    title: "Тетрадь деда Коли. Часть 3"
    talk_in:
      text: >-
        На обороте карточки — адрес. Соседняя деревня, двенадцать километров. Собралась и поехала. Сама не знаю, зачем.
      image: "Medium close-up: the grandmother in a warm coat and headscarf standing on a country road by a wooden bus stop, holding a bag, looking straight into the camera, determined"
      motion: "The grandmother talks to the camera, adjusts her headscarf, glances down the road, handheld smartphone video"
    broll:
      text: >-
        Коля мне всегда говорил: первый улей на базаре купил. А в той деревне жил старый пасечник, Фёдор Ильич. Коля к нему молодым бегал, с пчёлами учился разговаривать. Я ему мятный чай с мёдом в дорогу собирала — и не знала, куда он ездит.
      scenes:
        - flashback: true
          image: "Young Kolya kneeling by an old wooden beehive in a 1970s village garden, an old beekeeper in a straw hat beside him showing a honeycomb frame"
          motion: "The old man hands the frame to Kolya, bees fly around slowly, Kolya smiles carefully"
        - flashback: true
          image: "Young Kolya sitting on a stool next to a beehive at dusk, leaning close to it as if talking to the bees"
          motion: "He leans towards the hive, speaking quietly, bees crawl on the entrance board"
        - image: "The grandmother in a warm coat walking along a muddy village street with old wooden houses, autumn trees"
          motion: "She walks slowly, looking at the houses, searching"
        - image: "The grandmother standing at an old wooden gate with peeling blue paint in front of a small old village house"
          motion: "She hesitates, then knocks on the gate"
    talk_out:
      text: >-
        Дверь открыла старушка. Посмотрела на меня долго-долго и говорит: «Зоя? А Коля говорил, что ты придёшь».
      image: "Close-up: the grandmother in a warm coat and headscarf standing by an old wooden gate with peeling blue paint, looking straight into the camera, shocked"
      motion: "The grandmother speaks quietly to the camera, her voice catching, she presses her hand to her chest, handheld smartphone video"
    caption: |
      Тетрадь деда Коли. Часть 3 🐝

      Поехала по адресу с карточки. Не думала, что меня там ждут.

      Что она мне сказала дальше — завтра. А вы бы поехали? 👇

      Подпишись, чтоб не пропустить.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей.

  - id: "s1e4-korova"
    title: "Тетрадь деда Коли. Часть 4"
    talk_in:
      text: >-
        Её зовут Нина. Дочка того пасечника. Посадила меня за стол и спрашивает: «Про корову-то он тебе так и не сказал?»
      image: "Medium close-up: the grandmother sitting at a wooden table in an unfamiliar old village house, a cup of tea in front of her, looking straight into the camera, tense"
      motion: "The grandmother talks to the camera quietly, turns the teacup in her hands, handheld smartphone video"
    broll:
      text: >-
        Восьмидесятый год, голодная зима, дочке два года. Коля приводит корову: в карты, мол, выиграл. Я его сорок лет картёжником звала. А он ульи продал. Последние два — Нининому отцу. Чтоб у дочки молоко было. И Нину попросил: Зое ни слова.
      scenes:
        - flashback: true
          image: "A snowy 1980 Soviet village street in winter, young Kolya in a sheepskin coat leading a brown cow by a rope towards a wooden house"
          motion: "He walks through the snow pulling the cow, breath steaming, and waves towards the house"
        - flashback: true
          image: "Young Zoya in a winter shawl at the door of a wooden house holding a small child, looking surprised at a cow in the yard"
          motion: "She steps onto the porch, holds the child closer and laughs in disbelief"
        - flashback: true
          image: "Young Kolya and an old beekeeper carrying a wooden beehive across a snowy yard"
          motion: "They carry the hive slowly, Kolya looks back at it for a moment"
        - image: "Two elderly women at a wooden table in an old village house: the grandmother in her headscarf and a thin old woman with a grey bun and a dark green knitted shawl, talking"
          motion: "The thin old woman talks softly, the grandmother covers her mouth with her hand"
    talk_out:
      text: >-
        Сорок лет молчала. Вот за что «прости». А потом Нина говорит: «Последнюю страницу я писала не одна. Рядом сидел мальчик. Лет тринадцати».
      image: "Close-up: the grandmother sitting at a wooden table in an old village house, looking straight into the camera, eyes wet, confused"
      motion: "The grandmother speaks slowly to the camera, wipes her eye, then freezes, realizing something, handheld smartphone video"
    caption: |
      Тетрадь деда Коли. Часть 4 🐄

      Сорок лет я ругала его за карты. А он…

      Кто был тот мальчик? Пишите 👇 Завтра — часть 5.

