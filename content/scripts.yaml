  - id: s04-korova
    rubric: Сериал
    title: "Тетрадь деда Коли. Часть 4: Он продал ульи, чтобы…"
    voiceover: >-
      Восьмидесятый год, голодная зима, дочка маленькая. И вдруг Коля приводит корову. Говорит: в карты выиграл.
      Я сорок лет верила. Ругала его ещё за эти карты.
      А он ульи продал. Последние два. Чтобы у дочки молоко было. И ни слова.
      Творог я с той коровы делала — до сих пор так делаю. А на последней странице… теперь я знаю, чей это почерк.
    scenes:
      - image: A snowy 1980 Soviet village street in winter, young Kolya in a sheepskin coat leading a brown cow by a rope towards a wooden house
        motion: He walks through the snow pulling the cow, breath steaming, and waves towards the house
