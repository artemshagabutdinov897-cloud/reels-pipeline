  - id: 22-svekolnyj-kvas
    rubric: Живые заготовки
    title: Рубиновый квас, который все забыли
    voiceover: Раньше в каждом доме свекольный квас стоял, а теперь и не слыхал никто. Две свёклы кружочками — в банку, корочку ржаного, ложку соли, залить кипячёной водой. Марлей накрыла — и три дня на столе. Цвет как рубин, кисленький, бодрит. Я к обеду полстаканчика пью. Рецепт — в описании.
    scenes:
    - image: Close-up of deep ruby-red beet kvass being poured from a glass jar into a clear glass against the window light
      motion: The red liquid pours into the glass and glows in the light
    - image: The grandmother slicing peeled beets into rounds on a wooden board stained with red juice
      motion: The knife slices through the beet, she drops the rounds into a large glass jar
    - image: The grandmother adding a crust of rye bread into the jar of beets and covering the neck with gauze
      motion: She ties the gauze with a string and pats the jar twice
    - image: The grandmother at the kitchen table raising a small glass of red beet kvass
      motion: She takes a sip, squints happily and nods at the camera
    caption: 'Раньше свекольный квас в каждой избе стоял — к обеду, к окрошке, к борщу. А теперь спросишь — и не слыхал никто 🍷


      А ведь проще заготовки нет: свёкла, вода, соль да корочка хлеба. Три дня — и готово.


      Что нужно на 3-литровую банку:

      — 2–3 средние свёклы

      — корочка ржаного хлеба

      — 1 столовая ложка соли (можно ещё ложку мёда)

      — кипячёная остуженная вода


      Как делаю:

      1. Свёклу почисть и порежь кружочками или брусочками.

      2. Сложи в банку, чтобы заняла треть. Добавь соль и корочку.

      3. Залей тёплой кипячёной водой почти доверху.

      4. Горлышко — марлей, и на стол, подальше от солнца.

      5. Каждый день снимай пенку. На третий-пятый день квас кисленький — процеди и в холодильник.


      Как пью: полстаканчика перед обедом. На нём же варю холодный борщ летом — лучше покупного в сто раз.


      Советую начинать с пары глотков: квас кислый, с непривычки много не надо. Если с желудком беда — сперва спроси врача.


