  - id: "37-shchi-sutochnye"
    title: Суточные щи — Зоя говорит в камеру живым видео (липсинк)
    talk_in:
      text: >-
        Щи я сегодня варю, а есть будем завтра. Суточные, милок. Пока ночь не постоят — это ещё не щи.
      image: "Medium close-up: the grandmother in her rustic kitchen with the white Russian stove behind her, a black cast-iron pot steaming on the stove, looking straight into the camera with a warm sly smile, holding a big wooden ladle in her hand"
      motion: "The grandmother talks to the camera warmly, gestures a little with the wooden ladle, nods and smiles, small natural head movements, handheld smartphone video"
    broll:
      text: >-
        Говядину на косточке — в чугунок, пусть бульон варится. Кислую капусту тушу на сале с луком и морковкой, пока не станет мягкой. Всё в бульон — и в печь, томиться. А на ночь — в сени, на холодок.
      scenes:
        - image: "Close-up: a black cast-iron pot on the iron cooktop of the white Russian stove, a big piece of beef on the bone simmering in clear broth with a whole onion and a bay leaf, wisps of steam, fire glowing in the open mouth of the stove below"
          motion: "The broth gently simmers around the beef, steam rises, the fire flickers in the stove"
        - image: "Close-up: the grandmother's hands stirring sauerkraut with sliced onion and grated carrot in a black cast-iron frying pan on the iron cooktop of the white Russian stove, a piece of salo melting at the side, fire glowing below"
          motion: "Her wooden spatula stirs the sizzling cabbage, steam rises"
        - image: "The grandmother pushing a black cast-iron pot of cabbage soup into the glowing mouth of the white Russian stove with a long iron oven fork (ukhvat), red embers inside, warm kitchen light"
          motion: "She slides the pot deeper into the stove with the oven fork, embers glow"
        - image: "Close-up: a ladle pouring thick rich golden sour cabbage soup with pieces of beef into a deep clay bowl on a wooden table, a dollop of sour cream and a slice of dark rye bread beside, steam rising"
          motion: "The ladle pours the soup, steam rises, a spoon of sour cream is placed on top"
    talk_out:
      text: >-
        Со сметаной да с ржаной корочкой — лучше обеда нет. Напиши в комментариях «книга» — пришлю рецепты.
      image: "Close-up: the grandmother at the kitchen table with a deep clay bowl of steaming cabbage soup with a dollop of sour cream and a slice of rye bread, looking straight into the camera with a warm smile, holding a wooden spoon"
      motion: "The grandmother speaks to the camera, takes a spoonful of soup, closes her eyes with pleasure and smiles, handheld smartphone video"
    caption: |
      Суточные щи 🥣

      Сегодня варю — завтра едим. Ночь на холодке — и капуста, мясо и бульон становятся одним вкусом.

      Что нужно на 3-литровую кастрюлю:
      — 600 г говядины на кости
      — 500 г квашеной капусты
      — 1 луковица, 1 морковка
      — 2 картофелины (по желанию)
      — ложка сала или масла, лавровый лист, перец, зубчик чеснока
      — сметана и ржаной хлеб к столу

      Как делаю:
      1. Говядину залей 2,5 л холодной воды, сними пену и вари полтора часа.
      2. Капусту отожми и туши на сале с ложкой воды 30–40 минут, до мягкости.
      3. Лук и морковку обжарь и добавь к капусте.
      4. Мясо разбери и верни в бульон вместе с капустой. Картошку — по желанию.
      5. Лавровый лист, перец — и томи ещё час на самом малом огне. В печи или в духовке на 120°.
      6. Остуди и на ночь — в холодильник. Назавтра разогрей и добавь толчёный чеснок.

      Со сметаной да с ржаной корочкой.

      Напиши «книга» — пришлю рецепты 👇

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

