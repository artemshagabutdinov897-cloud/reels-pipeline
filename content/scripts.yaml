  - id: 23-mochenye-yabloki
    rubric: Живые заготовки
    title: Антоновка до весны — без сахара
    voiceover: 'Антоновку до весны сохраню — и без варенья, без сахара. Мочу, как мать мочила. Яблоки плотно в банку, листом смородины переложить. Рассол: литр воды, ложка соли, ложка мёда да ложка ржаной муки. Залила, гнёт сверху — и в прохладу на месяц. Хрустят, кисло-сладкие, как газировка. Рецепт — в описании.'
    scenes:
    - image: Close-up of a pickled green Antonovka apple being cut in half with a knife, juicy white flesh glistening
      motion: The knife cuts through, the halves fall apart, juice glistens
    - image: The grandmother picking yellow-green apples from an apple tree in an autumn garden into a wicker basket
      motion: She twists an apple off the branch and puts it into the basket
    - image: The grandmother packing apples tightly into a big glass jar, placing blackcurrant leaves between them
      motion: She places the apples one by one and tucks leaves between them
    - image: The grandmother at a wooden kitchen table biting into a pickled apple
      motion: She bites, laughs and shows the apple to the camera
    caption: 'Антоновка пошла — значит, пора мочить. Так яблоки до весны лежат, и никакого варенья с килограммом сахара 🍏


      Мочёное яблоко — это чудо: хрустит, кисло-сладкое, чуть шипит на языке, как газировка. Мама мочила в кадушке, я — в банках.


      Что нужно на 3-литровую банку:

      — антоновка, 2–2,5 кг (плотные, без бочков)

      — листья смородины или вишни

      — 1 литр воды

      — 1 столовая ложка соли

      — 1 столовая ложка мёда (или сахара)

      — 1 столовая ложка ржаной муки


      Как делаю:

      1. Яблоки помой, не чисти.

      2. На дно банки — листья, потом яблоки плотно, перекладывая листьями.

      3. Муку разведи в стакане горячей воды, добавь к остальной воде, соль, мёд. Остуди.

      4. Залей яблоки, чтобы рассол их покрывал.

      5. Сверху — блюдце и баночка с водой вместо гнёта.

      6. Неделю в комнате, потом в прохладу — погреб, балкон, холодильник. Через месяц готово.


      Рассол доливай, если яблоки его выпьют — они пьют первые дни.


      Сохрани до выходных 😉 А у вас антоновка растёт? 👇

