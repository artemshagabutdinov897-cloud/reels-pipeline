  - id: "07-pravila"
    rubric: Бабушкины правила
    title: Три правила, чтоб живот не болел
    hook: "3 правила, которые знала каждая бабушка"
    voiceover: >-
      Три правила, милок, и живот тебе спасибо скажет.
      Первое: не запивай еду чаем ледяным, пей потом, через полчасика.
      Второе: ужинай, пока светло. Коля мой говорил: пчела на ночь не ест — и ты не ешь.
      Третье: жуй. Тридцать раз, а не как утка — глотком. Спешка в тарелке — тяжесть в животе.
      Ещё сто рецептов в моей книжке — напиши в комментариях «книга», пришлю.
    scenes:
      - image: "The grandmother sitting at the kitchen table facing the camera, holding up one finger, teapot beside her"
        motion: "She raises one finger, speaking warmly"
      - image: "The grandmother on a bench outside the house at golden hour, eating from a bowl"
        motion: "She eats slowly, sun sets behind the apple tree"
      - image: "The grandmother at the apiary at dusk, bees returning to the hive"
        motion: "Bees fly into the hive entrance, she watches smiling"
      - image: "The grandmother at the table chewing slowly, holding up three fingers"
        motion: "She shows three fingers, playfully shakes her head"
    caption: |
      Три бабушкиных правила для лёгкого живота. Просто, бесплатно, работает на привычке 😉
      Какое нарушаешь ты? Честно 👇

