    voiceover: >-
      В деревне по воскресеньям грибник пекли — пирог с грибами да с картошкой.
      Тесто на кефире, без дрожжей, за десять минут. Начинка: картошка тонкими кружками, сверху грибы с луком.
      Накрыть тестом, защипнуть — и в печь на сорок минут.
      Внуков потом за уши не оттащишь.
      Ещё сто таких рецептов — по ссылке в шапке профиля.
    scenes:
      - image: "Close-up: the grandmother's hands breaking a golden-crusted round homemade pie on a wooden board, inside a filling of potatoes and forest mushrooms with onion"
        motion: "Her hands break the pie in half, the filling shows, light steam rises"
      - image: "The grandmother kneading soft pale dough in a large clay bowl on a floured wooden table in a rustic kitchen"
        motion: "She kneads the soft dough and forms it into a ball, calm kind face"
      - image: "The grandmother laying thin potato slices and fried mushrooms with onion onto rolled-out dough in a round baking pan on a floured table"
        motion: "She spreads the mushrooms over the potatoes, covers them with a layer of dough and pinches the edges"
      - image: "The grandmother sitting at the kitchen table with a checkered oilcloth, a round mushroom pie on a wooden board in front of her, a slice in her hand, warm kind face with a gentle closed-mouth smile"
        motion: "She takes a bite of the pie slice, chews with a happy squint and nods at the camera, she does not talk"
    caption: |
      Пиши в комментариях «Книга» — вышлю 7 бесплатных рецептов.
  - id: "34-opyata-marinad"
    rubric: Грибы
    title: Маринованные опята к Новому году
    voiceover: >-
      Раньше опята в сентябре мариновали, а на Новый год банку открываешь — хрустят.
      Опята сначала полчаса отвариваю, воду сливаю.
      Маринад: литр воды, две ложки соли, ложка сахара, лаврушка, гвоздика, перчик горошком.
      Опята туда на десять минут, в конце уксус — и в горячие банки.
      Новый год без них не Новый год.
      Ещё сто таких рецептов — по ссылке в шапке профиля.
    scenes:
      - image: "Close-up of a glass jar of marinated honey mushrooms with bay leaves, garlic and black peppercorns against the window light, the grandmother's hand on the lid"
        motion: "She opens the jar and lifts a small golden mushroom on a fork, the marinade glistens"
      - image: "The grandmother at the whitewashed Russian stove pouring cleaned honey mushrooms from an enamel colander into a large pot of water"
        motion: "She pours the mushrooms into the pot and stirs with a wooden spoon, calm kind face"
      - image: "The grandmother ladling hot honey mushrooms in marinade into clean glass jars standing on a linen towel, bay leaves and peppercorns visible"
        motion: "She ladles the mushrooms with marinade into a jar and screws on the lid"
      - image: "Festive table in the rustic kitchen: the grandmother sitting with a plate of marinated honey mushrooms with onion rings and boiled potatoes with dill, a small fir branch with a few old glass ornaments on the table, warm kind face with a gentle closed-mouth smile"
        motion: "She picks up a mushroom with a fork, eats it, squints happily and nods at the camera, she does not talk"
    caption: |
      Пиши в комментариях «Книга» — вышлю 7 бесплатных рецептов.
  - id: "35-ryzhiki"
    rubric: Грибы
    title: Рыжики за неделю
    voiceover: >-
      Рыжики у нас даже не варили — пересыпал солью, и через неделю на столе.
      Не мочу, не варю — только тряпочкой обтираю.
      В банку шляпками вниз, каждый слой — соль да лист смородины.
      Гнёт сверху — и в холод. Сок они сами пустят.
      Дед Коля их больше всех грибов любил.
      Ещё сто таких рецептов — по ссылке в шапке профиля.
    scenes:
      - image: "Close-up of bright orange saffron milk cap mushrooms layered with coarse salt and blackcurrant leaves in a wide clay bowl on a wooden table by the window"
        motion: "The grandmother's hand sprinkles coarse salt over the bright orange mushrooms"
      - image: "The grandmother at the kitchen table wiping fresh orange saffron milk cap mushrooms with a linen cloth, a wicker basket full of them beside her"
        motion: "She wipes a mushroom cap with the cloth and puts it into a bowl, calm kind face"
      - image: "Close-up of the grandmother's hands laying orange saffron milk caps caps down into a large glass jar, coarse salt and a blackcurrant leaf between the layers"
        motion: "Her hands lay the mushrooms, sprinkle salt, add a leaf and press down gently"
      - image: "The grandmother sitting at the kitchen table with a checkered oilcloth, a plate of salted saffron milk caps with sour cream and boiled potatoes with dill in front of her, warm kind face with a gentle closed-mouth smile"
        motion: "She picks up a mushroom with a fork, eats it, squints happily and nods at the camera, she does not talk"
    caption: |
      Пиши в комментариях «Книга» — вышлю 7 бесплатных рецептов.
  - id: "36-mif-lozhka"
    rubric: Грибы
    title: Серебряная ложка не спасёт
    voiceover: >-
      Мать моя ложку серебряную в грибы клала — почернеет, значит ядовитый.
      Сказки это, милок. Ложка не почернеет, лук не посинеет, а червяк и поганку ест.
      Правило одно: не знаешь гриб — не бери.
      Попала поганка в корзину — выкидывай всё.
      Сохрани и отправь тем, кто в лес ходит.
    scenes:
      - image: "Close-up of an old silver spoon in a small enamel pot of boiling forest mushrooms on the stove, the grandmother's hand reaching for the spoon"
        motion: "She lifts the silver spoon out of the pot, looks at it in the light and gently shakes her head"
      - image: "The grandmother at a wooden table cutting an onion in half next to a bowl of fresh forest mushrooms, calm kind face"
        motion: "She cuts the onion, glances at it and calmly puts it aside"
      - image: "The grandmother sorting a wicker basket of forest mushrooms on the kitchen table, holding one pale white mushroom with a white ring on the stem and a bulb at the base"
        motion: "She looks at the pale mushroom carefully and drops it into a bucket on the floor, calm and serious"
      - image: "The grandmother standing at the edge of an autumn birch forest holding a wicker basket of mushrooms, golden leaves, warm kind face with a gentle closed-mouth smile, looking at the camera"
        motion: "She lifts the basket slightly, nods at the camera kindly and gently wags her finger, she does not talk"
    caption: |
      Сохрани и отправь тем, кто в лес ходит.

  - id: "40-chainy-grib"
    rubric: Живые заготовки
    title: Чайный гриб, который все забыли
    voiceover: Раньше в каждом доме на окне банка с чайным грибом стояла, а теперь и не слыхал никто.
      Заварю чай — три ложки на банку, стакан сахару, остужу до тёплого. Гриб в банку, и стакан старого настоя.
      Марлей накрыла — и неделю в тепле. Кисленький, с пузырьками, бодрит. Рецепт — по ссылке в шапке профиля. Подпишись — и будь здоров!
    scenes:
      - image: Close-up of sparkling amber kombucha being poured from a three-litre glass jar with a pale beige tea mushroom floating on top into a clear faceted glass against the window light, lace curtain behind
        motion: The amber drink pours into the glass, tiny bubbles rise and glow in the light
      - image: The grandmother at a gas stove with a lit blue flame pouring white sugar from a faceted glass into dark amber tea in a white enamel saucepan with a dark blue rim, stirring with a wooden spoon
        motion: Sugar pours into the tea, the wooden spoon stirs in slow circles, light steam rises
      - image: The grandmother at the kitchen table lowering a thick pale beige round tea mushroom into a three-litre glass jar of cooled amber tea, then covering the neck with white gauze
        motion: The tea mushroom slides into the jar and floats up, she stretches gauze over the neck and ties it with string
      - image: The grandmother at the kitchen table by the window with red geraniums raising a glass of sparkling amber kombucha, the jar with the tea mushroom under gauze beside her
        motion: She takes a sip, squints happily and nods at the camera
    caption: |
      Раньше чайный гриб на каждом окне стоял — в трёхлитровой банке под марлей. А теперь спросишь — и не слыхал никто.

      Рецепт с граммами и как не загубить гриб — по ссылке в шапке профиля.

      А у вас на окне такая банка стояла? Подпишись — и будь здоров!

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это напиток, а не лечение.
