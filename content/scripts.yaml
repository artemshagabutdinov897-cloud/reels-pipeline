  - id: "11-zabrus"
    rubric: Пасека
    title: Забрус
    hook: "Эту жвачку пасечники жевали сто лет назад"
    voiceover: >-
      Внучок мой прошлым летом приехал, а я ему — на, жуй. Он глаза выпучил.
      Это забрус — крышечки с сот, которые срезают, когда мёд качают. Воск, мёд, немного прополиса.
      Жуёшь, как жвачку, минут десять, потом выплёвываешь. Сладко, пахнет лугом.
