  - id: "03-perga"
    rubric: Пасека
    title: Что такое перга
    hook: "Пасечники это едят сами, а не продают"
    voiceover: >-
      Про мёд все знают, а про пергу — единицы. Это пыльца, которую пчёлки в соты сложили и сами же законсервировали.
      Коля мой, царствие ему небесное, каждую весну её ел по чуть-чуть. Говорил: пчёлы дурного не запасут.
      Кисловатая, как хлебушек. Держи во рту, пока не растает, да не больше чайной ложки. Если на мёд аллергия — не трогай.
      Ещё сто рецептов в моей книжке — напиши в комментариях «книга», пришлю.
    scenes:
      - image: "The grandmother at a blue wooden beehive in a flowering meadow, wearing her headscarf, holding a honeycomb frame"
        motion: "She lifts a frame from the hive, a few bees fly around calmly"
      - image: "Extreme close-up of honeycomb cells packed with multicoloured bee bread, perga"
        motion: "Slow macro pan across the colourful cells"
      - image: "The grandmother sitting on a bench by the apiary, holding an old black and white photo of an elderly man with a beekeeper hat"
        motion: "She looks at the photo with a gentle smile, sunlight flickers"
      - image: "Close-up of perga granules in a small wooden spoon held by the grandmother"
        motion: "She shows the spoon to the camera, then puts the granules in her mouth"
    caption: |
      Перга — «пчелиный хлеб». Мало кто пробовал, а пасечники берегут для себя 🐝
      Пробовали когда-нибудь? Напиши в комментариях.
      Важно: при аллергии на мёд и продукты пчеловодства — нельзя.
      #перга #пасека #мёд #деревня #бабушкинырецепты

  - id: "04-hleb"
    rubric: Печка
    title: Ржаной хлеб на закваске
    hook: "Хлеб, от которого не пучит"
    voiceover: >-
      Магазинный хлеб на дрожжах — поела и ходишь, как шарик. А вот ржаной на закваске — другое дело.
      Закваску заводишь неделю: мука да вода, каждый день подкармливаешь. Потом ржаная мука, соль, тёплая вода — и закваску.
      Подойдёт за ночь. В печь или духовку, час. Корочка трещит, мякиш кисленький.
      Такой хлеб живот любит. Ещё сто рецептов в моей книжке — напиши в комментариях «книга», пришлю.
