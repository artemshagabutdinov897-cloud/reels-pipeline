  - id: "01-kapusta"
    rubric: Живые заготовки
    title: Квашеная капуста без уксуса
    hook: "Капуста, после которой живот спасибо скажет"
    voiceover: >-
      Доча, магазинную капусту с уксусом выкинь. Живая капустка — только соль да время.
      Три кило капусты, морковка, две столовые ложки соли без горки. Мни руками, пока сок не пустит.
      Утрамбуй в банку, чтоб сок сверху был. Три дня в тепле, каждый день протыкай палкой, газ выпускай.
      Потом в холод. Ешь понемножку к обеду — и тяжести как не бывало. Ещё сто рецептов в моей книжке, ссылка в шапке профиля.
    scenes:
      - image: "The grandmother at the wooden kitchen table shredding a large head of white cabbage with a big knife, pile of shredded cabbage in an enamel basin"
        motion: "She shreds cabbage with steady strokes, looks up at the camera and smiles"
      - image: "Close-up of the grandmother's hands kneading shredded cabbage with grated carrot in an enamel basin"
        motion: "Hands squeeze and knead the cabbage, juice appears, slow push-in"
      - image: "The grandmother pressing cabbage into a three-litre glass jar with her fist, brine visible on top"
        motion: "She presses the cabbage down, brine rises, she nods satisfied"
      - image: "The grandmother at the windowsill with geraniums pushing a long wooden stick down into a three-litre jar of shredded cabbage"
        motion: "She pokes the cabbage with the stick a couple of times and pulls it out, ordinary movement, camera almost still"
      - image: "The grandmother at the table with a small bowl of sauerkraut and a slice of rye bread, smiling at the camera"
        motion: "She takes a forkful, chews, gives a thumbs up"
    caption: |
      Капуста с уксусом из магазина и живая квашеная — это две разные еды. Вторую моя мать делала каждую осень, и я делаю 🥬

      Что нужно на трёхлитровую банку:
      — 3 кг белокочанной капусты
      — 1 крупная морковь
      — 2 столовые ложки соли без горки (простая, не йодированная)

      Как делаю:
      1. Капусту тонко шинкую, морковь тру на крупной тёрке.
      2. Солю и мну руками, пока не пустит сок. Рук не жалей, минут пять.
      3. Плотно утрамбовываю в банку кулаком, чтобы сок был сверху.
      4. Три дня держу в тепле. Каждый день протыкаю до дна деревянной палочкой, чтобы вышел газ, иначе будет горчить.
      5. Потом крышку — и в холод. Через неделю самый вкус.

      Ем понемножку к обеду, пару ложек. Просто так или с чёрным хлебом.

      Сохрани, чтобы в сезон не искать. А ты квасишь с морковкой или без? Напиши 👇

      📖 Напиши в комментариях «КНИГА» или просто ❤️ — пришлю тебе в директ бабушкины рецепты даром и ссылку на книжку.

      Баба Зоя — собирательный образ, рецепты из деревенских тетрадей. Это еда, а не лечение.

      #квашенаякапуста #заготовки #деревенскаяеда #бабушкинырецепты #рецептыбабушки #капуста #домашниезаготовки #простыерецепты #бабазоя

  - id: "02-kisel"
    rubric: Каши и взвары
    title: Овсяный кисель
    hook: "Кисель, который варили в каждой деревне"
    voiceover: >-
      Милок, это не тот кисель из пакета. Овсяный, настоящий.
      Стакан овсянки залей тремя стаканами тёплой воды, корочку ржаного хлеба сверху — и на ночь.
      Утром процеди, отожми. Вари на тихом огне, мешай, пока не загустеет. Соли щепотку.
      Тёплый, с ложкой масла — живот обволакивает, сытно и легко. Ещё сто рецептов в моей книжке. Напиши в комментариях «книга» — пришлю.
    scenes:
      - image: "The grandmother pouring rolled oats from a paper bag into a clay jug on the kitchen table"
        motion: "Oats pour into the jug, she adds water from a kettle"
      - image: "Close-up of a crust of rye bread floating on oats in water in a clay jug"
        motion: "She places the bread crust on top and covers the jug with a linen cloth"
      - image: "The grandmother straining the oat liquid through gauze into an enamel pot"
        motion: "Milky liquid streams through gauze, she squeezes the gauze"
      - image: "Enamel pot on the Russian stove, thick pale oat kissel being stirred with a wooden spoon"
        motion: "Spoon stirs thick kissel, steam rises"
      - image: "The grandmother with a cup of warm oat kissel with a melting pat of butter, smiling"
        motion: "She blows on the cup, sips, and nods warmly"
    caption: |
      Не тот кисель из пакета, что в детском саду давали. Этот варили в каждой деревне из того, что было в доме: овсянка, вода и корка хлеба 🥣

      Что нужно:
      — 1 стакан овсяных хлопьев (не быстрого приготовления)
      — 3 стакана тёплой кипячёной воды
      — корочка ржаного хлеба
      — щепотка соли, кусочек сливочного масла

      Как делаю:
      1. Вечером заливаю хлопья тёплой водой, сверху корочку хлеба, накрываю полотенцем — и на ночь.
      2. Утром процеживаю через марлю и хорошо отжимаю. Гущу не выбрасываю — в оладьи.
      3. Варю на тихом огне и всё время мешаю, пока не загустеет, как сметана. Минут 5–7.
      4. Соль по вкусу, ложку масла сверху.

      Пью тёплым на завтрак. Сытно, дёшево, и до обеда про еду не вспоминаешь.

      Сохрани себе на утро. А ты такой кисель пробовал или только из пакета? 👇

