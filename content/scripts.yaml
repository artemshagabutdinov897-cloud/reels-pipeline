        motion: Her finger slowly traces the little bee drawing, then rests on the empty page
      - image: The grandmother and the young grandson in hoodie at the kitchen table, he gestures remembering, she writes in the old notebook with a pen
        motion: He counts on his fingers, she writes carefully and nods
      - image: The grandmother pulling a tray of golden round honey gingerbread cookies out of the oven, warm kitchen light
        motion: She sets the tray down and leans in to smell the cookies, closing her eyes
      - image: The grandmother sitting on a bench by the beehives at golden hour with a plate of honey gingerbread and the old notebook on her lap
        motion: She breaks a gingerbread, looks at the hives and smiles softly
    caption: |
      Тетрадь деда Коли. Часть 6 — последняя 🍯

      Пустая страница. А сверху его рукой: «Медовый пряник. Для Зои».

      Сорок два года я просила у Коли этот рецепт. Он пёк пряники раз в год, на мой день рождения, и выгонял меня из кухни. Я просила записать — а он смеялся: «Потом, Зоя, потом».

      Не успел. Продиктовал Серёже, а тот не дописал — дед устал, решили завтра. А завтра не случилось.

      Серёжа вспомнил всё по памяти. И вот он — Колин пряник:
      1. 3 ложки мёда и 2 ложки масла растопи на водяной бане — тёплые, не горячие.
      2. Яйцо, щепотка соли, пол-ложки соды, по щепотке корицы и имбиря.
      3. Мука — около двух стаканов, до мягкого теста, которое не липнет.
      4. Шарики с грецкий орех, прижми ладонью.
      5. 180 градусов, 15–20 минут. Горячими — в полотенце, чтоб стали мягкими.

      Испекла. Первый раз в жизни. Пахнет как тогда — пасекой, августом и Колей.

      Спасибо вам, что читали со мной его тетрадь. Всё, что в ней было, и всё, что знаю я сама, — теперь в моей книжке «Бабушкин стол». Чтобы не пропало.

