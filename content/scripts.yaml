        motion: She turns the first page, freezes, covers her mouth with her hand
      - image: The grandmother at the kitchen table at night under a warm lamp, a cup of tea with thyme sprigs, the old notebook open in front of her
        motion: She slowly turns to the last pages, stops and looks straight at the camera, puzzled
    caption: |
      Тетрадь деда Коли. Часть 1 📓

      Полезла на чердак за банками — а там жестяная коробка из-под чая. Колина. Я её лет сорок не видела, думала, давно выбросил.

      А в коробке тетрадь. Обычная, школьная, в клетку. Открываю — его почерк. И первая строчка:
      «Зоя, если ты это читаешь — значит, я не успел сказать сам».

      Сорок два года вместе прожили. Я думала, знаю про него всё. Села прямо на пыльный пол и читала до темноты.

      Буду читать вам по страничке. К каждой — рецепт, у Коли там и про еду много.

      Сегодня — его чай с чабрецом. Коля пил его каждый вечер:
      1. Чайник ополосни кипятком.
      2. Ложка чёрного чая и веточка чабреца (сухого — щепотка).
      3. Залей горячей водой, но не бурлящей, накрой полотенцем на 5 минут.
      4. Мёд — только в тёплый, вприкуску, а не в кипяток.

      А на последней странице — не его почерк. Чей — пока сама не знаю.

