        prompt: "empty jar"
      k1:
        refs: [k0]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. Now a small handful of thin sticks of peeled fresh horseradish root, creamy white, lies at the bottom of the jar. No hands, no other objects."
      k2:
        refs: [k1]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. A few thin sticks of fresh peeled ginger, pale yellow, now lie on top of the horseradish sticks at the bottom of the jar. No hands, no other objects."
      k3:
        refs: [k2]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. A spoonful of thick glossy golden honey now covers the root sticks at the bottom of the jar. No hands, no spoon."
      k4:
        refs: [k3]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now filled two thirds with crystal clear vodka over the root sticks, the honey still lies as a golden layer at the bottom. No hands, no bottle."
      k5:
        refs: [k4]
        prompt: "Keep exactly the same jar, camera angle, black background and lighting as in the reference image. The jar is now closed with a simple plain silver metal screw lid, the liquid is evenly pale golden and clear, the horseradish and ginger sticks float in it, glowing in the side light. No hands."
